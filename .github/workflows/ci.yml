name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: build (${{ matrix.cc }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - cc: gcc
            pacotes: gcc
          # libclang-rt-dev traz o runtime dos sanitizers usados em `make test`
          - cc: clang
            pacotes: clang libclang-rt-dev
    env:
      CC: ${{ matrix.cc }}
      # Versão da libnfe (branch, tag ou commit do tooldoce) usada no CI.
      # Precisa do caminho exato no motor de grupos (icaroraci/tooldoce#278).
      LIBNFE_REF: master
    steps:
      - uses: actions/checkout@v4

      - name: Instalar dependências
        run: |
          sudo apt-get update
          sudo apt-get install -y libxml2-dev libxmlsec1-dev libcurl4-openssl-dev libssl-dev zlib1g-dev clang-format ${{ matrix.pacotes }}

      # Enquanto a libnfe não for empacotada, ela é compilada a partir do
      # tooldoce e instalada num prefixo, com o libnfe.pc dela
      - name: Instalar libnfe
        run: |
          sh .github/scripts/instalar_libnfe.sh "$RUNNER_TEMP/libnfe" "$LIBNFE_REF"
          echo "PKG_CONFIG_PATH=$RUNNER_TEMP/libnfe/lib/pkgconfig" >> "$GITHUB_ENV"

      - name: Schemas sem alteração
        if: matrix.cc == 'gcc'
        run: cd tests/schemas && sha256sum -c --quiet SHA256SUMS

      # Tabelas, padrões, diagramas e TODO.md gerados dos schemas pelos
      # geradores instalados pela libnfe (tools/documento.json)
      - name: Arquivos gerados atualizados
        if: matrix.cc == 'gcc'
        run: |
          f=$(pkg-config --variable=ferramentas libnfe)
          python3 "$f/gerar_esquemas.py" --config tools/documento.json --verificar
          python3 "$f/gerar_padroes.py" --config tools/documento.json --verificar
          python3 "$f/gerar_diagramas.py" --config tools/documento.json --todo
          git diff --exit-code -- docs/diagramas TODO.md || {
            echo "::error::Diagramas ou TODO.md desatualizados: rode gerar_diagramas.py --config tools/documento.json --todo"
            exit 1
          }
          test -z "$(git status --porcelain -- docs/diagramas)"

      - name: Formatação
        if: matrix.cc == 'gcc'
        run: make verificar-formato

      - name: Compilar
        run: sh .github/scripts/compilar.sh

      - name: Testes
        run: make test

      - name: Exemplos
        run: |
          make exemplos
          ./obj/emitir_mdfe tests/certificados/teste.pfx teste > /dev/null

      - name: Instalação
        run: |
          destino="$RUNNER_TEMP/destino"
          make install DESTDIR="$destino" PREFIX=/usr
          test -f "$destino/usr/lib/libmdf.so.1.0.0"
          test -L "$destino/usr/lib/libmdf.so.1"
          test -L "$destino/usr/lib/libmdf.so"
          test -f "$destino/usr/include/libmdf/versao.h"
          test -f "$destino/usr/include/libmdf/mdfe.h"
          test -f "$destino/usr/include/libmdf/evento.h"
          test -f "$destino/usr/include/libmdf/sefaz.h"
          test -f "$destino/usr/lib/pkgconfig/libmdf.pc"
          readelf -d "$destino/usr/lib/libmdf.so.1.0.0" | grep -q 'SONAME.*libmdf\.so\.1'
          PKG_CONFIG_PATH="$PKG_CONFIG_PATH:$destino/usr/lib/pkgconfig" pkg-config --exists libmdf
          make uninstall DESTDIR="$destino" PREFIX=/usr
          test -z "$(find "$destino" -type f -o -type l)"
